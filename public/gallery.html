<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Vault — Shared Photo Gallery</title>
    <meta name="description" content="Upload photos with a name and 4-digit PIN, browse a responsive gallery, favourite and search photos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0e1020;
        --surface: #171a2f;
        --surface-2: #1f2340;
        --line: #2c3157;
        --text: #eef0ff;
        --muted: #9aa0c6;
        --brand: #6c5ce7;
        --brand-2: #00d2ff;
        --pink: #ff4d94;
        --gold: #ffce3a;
        --danger: #ff5a5f;
        --radius: 16px;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(900px 500px at 10% -10%, rgba(108, 92, 231, 0.35), transparent 60%),
          radial-gradient(800px 500px at 100% 0%, rgba(0, 210, 255, 0.22), transparent 55%),
          var(--bg);
        color: var(--text);
        font-family: Manrope, system-ui, -apple-system, Segoe UI, sans-serif;
        min-height: 100vh;
      }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 18px 80px; }
      header h1 {
        font-family: Sora, sans-serif;
        font-size: clamp(28px, 5vw, 44px);
        margin: 0 0 6px;
        background: linear-gradient(90deg, var(--brand-2), var(--brand) 45%, var(--pink));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      header p { color: var(--muted); margin: 0 0 24px; }
      .card {
        background: linear-gradient(180deg, var(--surface), var(--surface-2));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }
      form.upload { display: grid; gap: 14px; grid-template-columns: 1fr 1fr 140px auto; align-items: end; }
      .field { display: grid; gap: 6px; }
      label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      input[type="text"], input[type="password"], input[type="file"], input[type="search"] {
        width: 100%; padding: 12px 14px; border-radius: 12px;
        border: 1px solid var(--line); background: #12152a; color: var(--text);
        font: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
      }
      input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(108, 92, 231, .3); }
      input[type="file"]::file-selector-button {
        border: 0; padding: 8px 12px; margin-right: 10px; border-radius: 9px; cursor: pointer;
        background: var(--brand); color: #fff; font: inherit;
      }
      button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
      .btn-primary {
        padding: 12px 22px; color: #fff; font-weight: 600;
        background: linear-gradient(90deg, var(--brand), var(--pink));
        box-shadow: 0 8px 24px rgba(108, 92, 231, .4);
        transition: transform .12s, filter .12s;
      }
      .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.08); }
      .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

      .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 28px 0 16px; }
      .searchbar { position: relative; flex: 1 1 280px; padding: 2px; border-radius: 999px;
        background: linear-gradient(90deg, var(--brand-2), var(--brand), var(--pink), var(--gold)); }
      .searchbar input { border-radius: 999px; border: 0; background: #12152a; padding-left: 42px; }
      .searchbar::after { content: "🔍"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); }
      .chip {
        padding: 11px 18px; border-radius: 999px; background: #12152a; color: var(--muted);
        border: 1px solid var(--line); font-weight: 600;
      }
      .chip.active { color: #1a1400; background: linear-gradient(90deg, var(--gold), #ffb02e); border-color: transparent; }

      .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
      .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
      .tile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #0b0d19; }
      .tile .meta { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .who { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .when { font-size: 12px; color: var(--muted); }
      .actions { display: flex; gap: 8px; }
      .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; font-size: 16px; background: #12152a; border: 1px solid var(--line); color: var(--text); transition: background .15s; }
      .icon-btn:hover { background: #232849; }
      .icon-btn.fav.on { background: rgba(255, 206, 58, .18); border-color: var(--gold); }
      .icon-btn.del:hover { background: rgba(255, 90, 95, .2); border-color: var(--danger); }
      .empty, .status { color: var(--muted); text-align: center; padding: 40px 10px; }
      .toast {
        position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
        background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
        padding: 12px 18px; border-radius: 999px; box-shadow: var(--shadow);
        opacity: 0; pointer-events: none; transition: all .25s; z-index: 40; max-width: 90vw;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      .toast.err { border-color: var(--danger); }
      @media (max-width: 860px) { form.upload { grid-template-columns: 1fr 1fr; } form.upload .full { grid-column: 1 / -1; } }
      @media (max-width: 560px) { form.upload { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Pixel Vault</h1>
        <p>Upload a photo with your name and a 4-digit PIN. Anyone can view — only the PIN can delete.</p>
      </header>

      <section class="card">
        <form class="upload" id="uploadForm">
          <div class="field">
            <label for="name">Uploader name</label>
            <input id="name" type="text" placeholder="Jane Doe" required maxlength="40" />
          </div>
          <div class="field">
            <label for="file">Photo</label>
            <input id="file" type="file" accept="image/*" required />
          </div>
          <div class="field">
            <label for="pin">Secret PIN</label>
            <input id="pin" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="••••" required />
          </div>
          <div class="field full">
            <button class="btn-primary" id="submitBtn" type="submit">Upload photo</button>
          </div>
        </form>
      </section>

      <div class="toolbar">
        <div class="searchbar"><input id="search" type="search" placeholder="Search by uploader or file name…" /></div>
        <button class="chip" id="favToggle" type="button">★ Favourites only</button>
      </div>

      <div id="status" class="status">Loading gallery…</div>
      <div class="grid" id="gallery"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore, collection, addDoc, deleteDoc, doc, getDoc,
        onSnapshot, orderBy, query, serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      import {
        getStorage, ref, uploadBytes, getDownloadURL, deleteObject,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

      /* 1) Firebase console → Project settings → Your apps → Web app → copy config here.
         2) Enable Firestore (collection "photos") and Storage.
         3) Rules below allow public upload/read/delete without sign-in:

         Firestore rules:
           rules_version = '2';
           service cloud.firestore {
             match /databases/{db}/documents {
               match /photos/{id} { allow read, create, delete: if true; }
             }
           }

         Storage rules:
           rules_version = '2';
           service firebase.storage {
             match /b/{bucket}/o {
               match /photos/{file} { allow read, write: if true; }
             }
           }
      */
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const storage = getStorage(app);
      const photosCol = collection(db, "photos");

      const $ = (id) => document.getElementById(id);
      const toastEl = $("toast");
      let toastTimer;
      function toast(msg, isError = false) {
        toastEl.textContent = msg;
        toastEl.className = "toast show" + (isError ? " err" : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (toastEl.className = "toast"), 3200);
      }

      let photos = [];
      let favourites = new Set(JSON.parse(localStorage.getItem("favourites") || "[]"));
      let favOnly = false;
      let searchTerm = "";

      /* ---------- Upload ---------- */
      $("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("name").value.trim();
        const pin = $("pin").value.trim();
        const file = $("file").files[0];
        if (!/^\d{4}$/.test(pin)) return toast("PIN must be exactly 4 digits.", true);
        if (!file || !file.type.startsWith("image/")) return toast("Please choose an image file.", true);

        const btn = $("submitBtn");
        btn.disabled = true;
        btn.textContent = "Uploading…";
        try {
          const path = `photos/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${file.name.replace(/[^\w.\-]/g, "_")}`;
          const storageRef = ref(storage, path);
          await uploadBytes(storageRef, file);
          const url = await getDownloadURL(storageRef);
          await addDoc(photosCol, {
            name, pin, url, path,
            fileName: file.name,
            createdAt: serverTimestamp(),
          });
          e.target.reset();
          toast("Photo uploaded!");
        } catch (err) {
          console.error(err);
          toast("Upload failed: " + err.message, true);
        } finally {
          btn.disabled = false;
          btn.textContent = "Upload photo";
        }
      });

      /* ---------- Live gallery ---------- */
      onSnapshot(
        query(photosCol, orderBy("createdAt", "desc")),
        (snap) => {
          photos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          render();
        },
        (err) => {
          console.error(err);
          $("status").textContent = "Could not load gallery: " + err.message;
        }
      );

      /* ---------- Delete (PIN protected) ---------- */
      async function deletePhoto(id) {
        const entered = prompt("Enter the 4-digit PIN used to upload this photo:");
        if (entered === null) return;
        if (!/^\d{4}$/.test(entered.trim())) return toast("PIN must be 4 digits.", true);
        try {
          const snap = await getDoc(doc(db, "photos", id));
          if (!snap.exists()) return toast("Photo no longer exists.", true);
          const data = snap.data();
          if (String(data.pin) !== entered.trim()) return toast("Wrong PIN — delete cancelled.", true);

          try {
            const objectRef = data.path ? ref(storage, data.path) : ref(storage, data.url);
            await deleteObject(objectRef);
          } catch (storageErr) {
            if (storageErr.code !== "storage/object-not-found") throw storageErr;
          }
          await deleteDoc(doc(db, "photos", id));
          favourites.delete(id);
          saveFavourites();
          toast("Photo deleted.");
        } catch (err) {
          console.error(err);
          toast("Delete failed: " + err.message, true);
        }
      }

      /* ---------- Favourites & search ---------- */
      function saveFavourites() {
        localStorage.setItem("favourites", JSON.stringify([...favourites]));
      }
      function toggleFavourite(id) {
        favourites.has(id) ? favourites.delete(id) : favourites.add(id);
        saveFavourites();
        render();
      }
      $("favToggle").addEventListener("click", (e) => {
        favOnly = !favOnly;
        e.currentTarget.classList.toggle("active", favOnly);
        render();
      });
      $("search").addEventListener("input", (e) => {
        searchTerm = e.target.value.trim().toLowerCase();
        render();
      });

      /* ---------- Render ---------- */
      function render() {
        const grid = $("gallery");
        const list = photos.filter((p) => {
          if (favOnly && !favourites.has(p.id)) return false;
          if (!searchTerm) return true;
          return `${p.name || ""} ${p.fileName || ""}`.toLowerCase().includes(searchTerm);
        });

        $("status").textContent = list.length ? "" : photos.length ? "No photos match your filters." : "No photos yet — be the first to upload!";
        grid.innerHTML = "";

        for (const p of list) {
          const tile = document.createElement("article");
          tile.className = "tile";

          const img = document.createElement("img");
          img.src = p.url;
          img.alt = `Photo uploaded by ${p.name || "someone"}`;
          img.loading = "lazy";

          const meta = document.createElement("div");
          meta.className = "meta";

          const info = document.createElement("div");
          const who = document.createElement("div");
          who.className = "who";
          who.textContent = p.name || "Anonymous";
          const when = document.createElement("div");
          when.className = "when";
          when.textContent = p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString() : "Just now";
          info.append(who, when);

          const actions = document.createElement("div");
          actions.className = "actions";

          const fav = document.createElement("button");
          fav.type = "button";
          fav.className = "icon-btn fav" + (favourites.has(p.id) ? " on" : "");
          fav.title = "Toggle favourite";
          fav.textContent = favourites.has(p.id) ? "★" : "☆";
          fav.addEventListener("click", () => toggleFavourite(p.id));

          const del = document.createElement("button");
          del.type = "button";
          del.className = "icon-btn del";
          del.title = "Delete photo";
          del.textContent = "🗑";
          del.addEventListener("click", () => deletePhoto(p.id));

          actions.append(fav, del);
          meta.append(info, actions);
          tile.append(img, meta);
          grid.append(tile);
        }
      }
    </script>
  </body>
</html>
